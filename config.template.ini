# DesktopShade 设置：用记事本改就行，保存后程序半秒内自动跟上
# autostart  True=开机自启，False=不开机自启
# logclean   日志清理间隔：数字+单位，如 3days / 10minutes / 1month（单复数都可）
# tray       1=显示托盘图标，0=不显示
# menu_* / traymenu_*  是右键菜单上显示的字，只改字不改功能；值里别用 # 号
autostart=True
logclean=3days
tray=1
menu_show=显示桌面图标
menu_native=Windows 原生菜单（新建 / 刷新 / 个性化）
menu_tray=
menu_exit=退出 DesktopShade（下次登录仍会自启）
traymenu_state=当前
traymenu_hide=隐藏桌面图标
traymenu_show=显示桌面图标
traymenu_tip=再点一次空白处也能恢复
traymenu_auto=登录时自动启动
traymenu_selfhide=隐藏这个托盘图标
traymenu_quit=退出 DesktopShade
